<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图案稳定性测试 — WebEncryptor</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
        h1 { font-size: 1.25rem; }
        p { font-size: 0.9rem; color: #4b5563; }
        #pad { width: 100%; }
        .controls { margin-top: 1rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        button { padding: 0.4rem 1rem; border: 1px solid #d1d5db; border-radius: 0.375rem; background: #f9fafb; cursor: pointer; }
        button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
        #summary { font-size: 0.9rem; font-weight: 600; }
        #log { font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 0.75rem; margin-top: 1rem; min-height: 4em; max-height: 320px; overflow-y: auto; }
        .tip { background: #fffbeb; border: 1px solid #fde68a; border-radius: 0.375rem; padding: 0.6rem 0.9rem; font-size: 0.85rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>手绘图案稳定性测试</h1>
    <p>目的：验证"每次画得差不多"能否稳定识别为同一个方向序列。<br>
       方法：在下方长条形画板上画你的图案（<b>横/竖/斜直线段均可、至少 10 段、每段画长一些</b>），点"记录本次"（画板自动清空），连画 10 次以上，看一致率。</p>
    <div class="tip">💡 测试前先画 1~2 次热身，确认反馈栏显示"有效"且段数符合你的预期；正式记录时每次按同样的记忆画。</div>
    <div id="pad"></div>
    <div class="controls">
        <button id="recordBtn" class="primary">记录本次</button>
        <button id="clearAllBtn">清空记录</button>
        <span id="summary"></span>
    </div>
    <pre id="log"></pre>

    <script type="module">
        import { createSignaturePad } from './SignaturePad.js';

        const pad = createSignaturePad(document.getElementById('pad'), { minSegments: 10 });
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let records = [];

        function render() {
            if (records.length === 0) {
                summaryEl.textContent = '';
                logEl.textContent = '';
                return;
            }
            const ok = records.filter(r => r.ok).length;
            const pct = (100 * ok / records.length).toFixed(0);
            summaryEl.textContent = `已记录 ${records.length} 次, 与首次一致 ${ok} 次 (${pct}%)`;
            const first = records[0].seq || records[0].reason;
            logEl.textContent =
                `基准(第1次): ${first}\n` +
                records.map((r, i) => `${String(i + 1).padStart(2)}. ${r.ok ? '✅' : '❌'} ${r.seq || r.reason}`).join('\n');
        }

        document.getElementById('recordBtn').addEventListener('click', () => {
            const seq = pad.getSequence();
            const status = pad.getStatus();
            const ok = !!seq;
            records.push(seq ? { ok: true, seq } : { ok: false, reason: status });
            render();
            pad.clear();
        });

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            records = [];
            render();
            pad.clear();
        });
    </script>
</body>
</html>
