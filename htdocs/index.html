<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Offline Encryptor</title>
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
</script>
</head>

<body>
    <div class="container" style="padding-bottom: 1.5rem;">
        <h1>Advanced Offline Encryptor</h1>

        <div class="tabs" style="display: flex; align-items: center; position: relative;">
            <button class="tab-button active" data-tab="crypto">Crypto</button>
            <button class="tab-button" data-tab="password-manager">Manager</button>
            <button id="moreOptionsButton" title="More Options" aria-label="More Options" aria-haspopup="true"
                style="margin-left: auto; background-color: transparent; border: none; cursor: pointer; padding: 0.25rem; color: #6B7280; line-height: 0;">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="currentColor">
                    <path
                        d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
                </svg>
            </button>
            <!-- Popup Menu -->
            <div id="moreOptionsMenu" class="popup-menu" role="menu">
                <button id="shutdownButton" class="popup-menu-item" role="menuitem">Shutdown</button>
            </div>
        </div>

        <div id="crypto" class="tab-content active" style="position: relative;">
            <h2>Encrypt / Decrypt Data</h2>

            <!-- Input card: mutually exclusive Encrypt/Decrypt inputs -->
            <div class="input-card">
                <div class="input-panes">
                    <!-- Encrypt input -->
                    <div class="input-pane active" id="encryptCard" data-card="encrypt">
                        <div class="input-pane-header">
                            <label for="plaintext">Data to Encrypt:</label>
                            <button type="button" id="showGeneratePasswordModalButton" class="link-style-button">Generate secure
                                passwords</button>
                        </div>
                        <div class="input-pane-body" style="position: relative;"> <!-- Wrapper for textarea and paste button -->
                            <textarea id="plaintext" rows="3" aria-label="Data to encrypt"
                                style="width: 100%; box-sizing: border-box; padding-right: 40px; padding-bottom: 30px;"></textarea>
                            <button id="pastePlaintextButton" title="Paste" aria-label="Paste into Data to Encrypt"
                                style="position: absolute; bottom: 8px; right: 8px; background-color: transparent; border: none; padding: 0.375rem; cursor: pointer; color: #4B5563; border-radius: 0.25rem; line-height: 0; z-index: 5;">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7-.25c.41 0 .75.34.75.75s-.34.75-.75.75-.75-.34-.75-.75.34-.75.75-.75zM12 15l-4-4h2.5V7h3v4H16l-4 4z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Decrypt input -->
                    <div class="input-pane" id="decryptCard" data-card="decrypt">
                        <div class="input-pane-header">
                            <label for="ciphertextInput">Ciphertext (Base64):</label>
                        </div>
                        <div class="input-pane-body" style="position: relative;"> <!-- Wrapper for textarea and paste button -->
                            <textarea id="ciphertextInput" rows="5" aria-label="Ciphertext in Base64 to decrypt"></textarea>
                            <button id="pasteCiphertextButton" title="Paste" aria-label="Paste into Data to Decrypt"
                                style="position: absolute; bottom: 8px; right: 8px; background-color: transparent; border: none; padding: 0.375rem; cursor: pointer; color: #4B5563; border-radius: 0.25rem; line-height: 0; z-index: 5;">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7-.25c.41 0 .75.34.75.75s-.34.75-.75.75-.75-.34-.75-.75.34-.75.75-.75zM12 15l-4-4h2.5V7h3v4H16l-4 4z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="mode-switch-wrap">
                    <div class="mode-switch" aria-label="Operation mode">
                        <button type="button" class="mode-button active" data-mode="encrypt"
                            aria-pressed="true">Encrypt</button>
                        <button type="button" class="mode-button" data-mode="decrypt"
                            aria-pressed="false">Decrypt</button>
                    </div>
                </div>
            </div>

            <!-- Shared password factor inputs (used for both encryption and decryption) -->
            <div class="shared-factors">
                <div class="form-group">
                    <label for="passwordEncrypt">Password (secret factor A):</label>
                    <input type="password" id="passwordEncrypt" aria-label="Password (secret factor A)" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="RuleEncrypt">Rule Phrase (secret factor C):</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="RuleEncrypt" autocomplete="off"
                            placeholder="e.g. my-vault-v2 (any fixed phrase)"
                            aria-label="Rule phrase (secret factor C)" style="width: 100%; padding-right: 2.5rem;">
                        <button type="button" class="toggle-rule-button" id="toggleRuleEncrypt" title="Show/Hide Rule"
                            aria-label="Show/Hide Rule"
                            style="position: absolute; right: 0.5rem; background: transparent; border: none; cursor: pointer; color: #6B7280; padding: 0.25rem;">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="obfuscationFunctionEncrypt">Interactive Color Grid (Path) (secret factor B):</label>
                    <div id="ChessboardEncrypt"></div>
                </div>
            </div>

            <!-- Output area (ciphertext after encrypt, plaintext after decrypt) -->
            <div class="output-card" role="region" aria-labelledby="cryptoOutputHeading">
                <h3 id="cryptoOutputHeading"
                    style="font-size: 1.125rem; font-weight: 600; margin-bottom: 0.25rem; color: #4B5563; padding-right: 60px;">
                    Ciphertext (Base64):</h3>
                <p id="cryptoOutput" aria-label="Encrypted ciphertext in Base64"
                    style="font-size: 0.875rem; color: #1F2937; word-break: break-all; font-family: monospace; white-space: pre-wrap; min-height: 2.5em; padding-bottom: 2.5rem;">
                </p>
                <button id="saveToManagerButton" aria-label="Save to Password Manager" title="Save to Password Manager"
                    style="position: absolute; bottom: 0.75rem; right: 2.75rem; background-color: transparent; border: none; padding: 0.375rem; cursor: pointer; color: #4B5563; border-radius: 0.25rem; line-height: 0; z-index: 5;">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zM2 16h8v-2H2v2zm19-4v-2h-2v2h-2v2h2v2h2v-2h2v-2z" />
                    </svg>
                </button>
                <button id="copyCiphertextButton" aria-label="Copy Ciphertext" title="Copy Ciphertext"
                    style="position: absolute; bottom: 0.75rem; right: 0.75rem; background-color: transparent; border: none; padding: 0.375rem; cursor: pointer; color: #4B5563; border-radius: 0.25rem; line-height: 0; z-index: 5;">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                    </svg>
                </button>
                <button id="actionButton" class="button" aria-label="Encrypt data" title="Encrypt Data"
                    style="position: absolute; top: 0.75rem; right: 0.75rem; width: 56px; height: 56px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; z-index: 10; background-color: #3B82F6; color: white; border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="password-manager" class="tab-content">
            <div class="pm-header">
                <h2>Password Manager</h2>
                <button class="pm-button" id="add-password-btn">Add New</button>
            </div>
            <div id="password-list">
                <!-- Password cards will be injected here by JavaScript -->
            </div>
        </div>

        <div id="loadingIndicator" class="loading-indicator" style="display: none;">Initializing Worker...</div>
        <div class="progress-bar-container" id="progressBarContainer" style="display: none;" aria-live="polite">
            <div class="progress-bar" id="progressBar"></div>
            <span class="progress-text" id="progressText"></span>
        </div>
        <div id="errorDisplay" class="error-message" style="display: none;"></div>
    </div>

    <!-- Password Generator Modal -->
    <div id="passwordGeneratorModal" class="modal" style="display: none;" role="dialog" aria-modal="true"
        aria-labelledby="passwordModalTitle">
        <div class="modal-content">
            <span class="modal-close-button" id="closePasswordModalButton" title="Close" aria-label="Close">×</span>
            <h3 id="passwordModalTitle">Select Password Strength</h3>
            <div class="modal-options">
                <button type="button" class="modal-option-button" data-length="8">Weak (8 characters)</button>
                <button type="button" class="modal-option-button" data-length="14">Medium (14 characters)</button>
                <button type="button" class="modal-option-button" data-length="18">Strong (18 characters)</button>
            </div>
        </div>
    </div>

    <!-- Decryption Result Floating Window (reuses the confirmation/verification modal styles) -->
    <div id="decryptResultDialog" class="modal" style="display: none;" role="dialog" aria-modal="true"
        aria-labelledby="decryptResultDialogTitle">
        <div class="modal-content">
            <span class="modal-close-button" id="closeDecryptResultButton" title="Close" aria-label="Close">×</span>
            <h3 id="decryptResultDialogTitle">Decryption Result</h3>
            <p id="decryptResultText" aria-label="Decrypted plaintext"
                style="font-size: 0.875rem; color: #1F2937; word-break: break-all; font-family: monospace; white-space: pre-wrap; text-align: left; background-color: #f8fafc; border: 1px solid #eee; border-radius: 5px; padding: 12px; min-height: 2.5em; max-height: 45vh; overflow-y: auto; margin: 0;"></p>
            <button type="button" id="copyDecryptResultButton" class="button"
                style="margin-top: 15px; width: 100%;">Copy</button>
        </div>
    </div>

    <template id="password-card-template">
        <div class="pm-card">
            <div class="pm-card-content">
                <!-- View Mode -->
                <div class="view-mode">
                    <h3 data-name></h3>
                    <p data-description></p>
                </div>

                <!-- Edit Mode -->
                <div class="edit-mode">
                    <div class="pm-form-group">
                        <label for="edit-name">Name</label>
                        <input type="text" data-name-input id="edit-name">
                    </div>
                    <div class="pm-form-group">
                        <label for="edit-desc">Description</label>
                        <textarea data-description-input id="edit-desc"></textarea>
                    </div>
                    <div class="pm-form-group">
                        <label for="edit-pass">Password (Base64)</label>
                        <input type="text" data-password-input id="edit-pass">
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pm-card-actions">
                <button class="pm-icon-button save-btn" title="Save Changes">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M21,20V8.414a1,1,0,0,0-.293-.707L16.293,3.293A1,1,0,0,0,15.586,3H4A1,1,0,0,0,3,4V20a1,1,0,0,0,1,1H20A1,1,0,0,0,21,20ZM9,8h4a1,1,0,0,1,0,2H9A1,1,0,0,1,9,8Zm8,11H7V15a1,1,0,0,1,1-1H16a1,1,0,0,1,1,1Z" />
                    </svg>
                </button>
                <button class="pm-icon-button cancel-btn" title="Cancel Edit">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 13.41 12z" />
                    </svg>
                </button>
                <button class="pm-icon-button edit-btn" title="Edit">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M19.4,7.34,16.66,4.6A2,2,0,0,0,14.16,4a2,2,0,0,0-1.42.59L5,12.29a1,1,0,0,0-.29.71V17a1,1,0,0,0,1,1H10a1,1,0,0,0,.71-.29l7.71-7.71A2,2,0,0,0,19.4,7.34ZM9.08,16H6V12.92l6.29-6.3,3.08,3.08Z" />
                    </svg>
                </button>
                <button class="pm-icon-button use-for-decrypt-btn" title="Decrypt" aria-label="Decrypt">
                    <svg class="icon-decrypt" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z" />
                    </svg>
                    <svg class="icon-jump" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
                <button class="pm-icon-button delete-btn" title="Delete">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M20,6H16V5a3,3,0,0,0-3-3H11A3,3,0,0,0,8,5V6H4A1,1,0,0,0,4,8H5V19a3,3,0,0,0,3,3h8a3,3,0,0,0,3-3V8h1a1,1,0,0,0,0-2ZM10,5a1,1,0,0,1,1-1h2a1,1,0,0,1,1,1V6H10Zm7,14a1,1,0,0,1-1,1H8a1,1,0,0,1-1-1V8H17Z" />
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <script type="module" src="index.js"></script>
    <script type="module" src="password_manager.js"></script>
</body>

</html>
